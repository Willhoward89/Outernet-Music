<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Schvitzers Rhyme</title>
  <meta name="description" content="Schvitzers Rhyme – video">
  <meta property="og:title" content="Schvitzers Rhyme">
  <meta property="og:type" content="video.other">
  <meta property="og:image" content="poster.jpg">
  <meta property="og:video" content="video.mp4">
  <style>
    :root { --bg: #0b0b0c; --fg: #f2f2f2; --muted: #9a9a9a; }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg);
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    main { min-height: 100%; display: flex; flex-direction: column; align-items: center;
      justify-content: center; padding: 24px 16px; gap: 16px; }
    h1 { margin: 0; font-size: clamp(1.4rem, 4vw, 2.2rem); letter-spacing: .02em; }
    .player { width: 100%; max-width: 960px; aspect-ratio: 832 / 464; background: #000;
      border-radius: 10px; overflow: hidden; box-shadow: 0 10px 40px rgba(0,0,0,.6); }
    video { width: 100%; height: 100%; display: block; }
    footer { color: var(--muted); font-size: .85rem; }
  </style>
</head>
<body>
  <main>
    <h1>Schvitzers Rhyme</h1>
    <div class="player">
      <video controls playsinline preload="metadata" poster="poster.jpg">
        <source src="video.mp4" type="video/mp4">
        Your browser can't play this video. <a href="video.mp4">Download it here.</a>
      </video>
    </div>
    <footer>&copy; Pinball Publishing</footer>
  </main>
</body>
</html>
